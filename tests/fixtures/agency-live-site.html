<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      body { width: 1200px; min-height: 1400px; margin: 0; background: #f4efe8; color: #171717; font-family: Arial, sans-serif; }
      header { display: flex; height: 92px; padding: 0 68px; align-items: center; justify-content: space-between; border-bottom: 1px solid #cfc8be; }
      main { display: grid; min-height: 780px; padding: 110px 68px; align-content: space-between; background: linear-gradient(135deg, #f4efe8 0 62%, #f0653b 62%); }
      h1 { max-width: 720px; margin: 0; font-size: 92px; line-height: .94; letter-spacing: -.07em; }
      p { max-width: 460px; margin: 0; font-size: 25px; line-height: 1.35; }
    </style>
  </head>
  <body>
    <header><strong>STUDIO KODETY</strong><span>Projetos · Sobre · Contato</span></header>
    <main><h1>Design que começa pela estrutura.</h1><p>Uma página publicada exibida diretamente no card, sem gerar imagens intermediárias.</p></main>
  </body>
</html>
