map $uri $kodety_cache_control {
  default "no-cache, no-store, must-revalidate";
  ~^/assets/(?:studio\.js|studio\.css|kodety\.zip)$ "no-cache, no-store, must-revalidate";
  ~^/assets/ "public, max-age=31536000, immutable";
}

map $uri $kodety_embedder_policy {
  default "credentialless";
  /project-storage.html "";
  /project-storage "";
}
map $uri $kodety_document_policy {
  default "";
  /project-storage.html "isolate-and-credentialless";
  /project-storage "isolate-and-credentialless";
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  add_header Cache-Control $kodety_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy $kodety_embedder_policy always;
  add_header Document-Isolation-Policy $kodety_document_policy always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), clipboard-read=(self \"https://playground.wordpress.net\"), clipboard-write=(self \"https://playground.wordpress.net\")" always;
  # Imported HTML may fetch its authored HTTPS APIs/media. Canvas documents
  # remain sandboxed without allow-same-origin; local code/fonts/media use
  # packaged assets and object URLs and keep working without a network.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: blob: https:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; frame-src 'self' blob: https:; connect-src 'self' https: blob: data:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

  location = /service-worker.js {
    default_type application/javascript;
    try_files $uri =404;
  }

  location = /project-storage {
    try_files /project-storage.html =404;
  }

  location ~ \.webmanifest$ {
    types { application/manifest+json webmanifest; }
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
