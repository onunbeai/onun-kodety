<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />
    <title>Studio — diagnóstico local de SQLite</title>
    <style>
      body { margin: 0; background: #151515; color: #eee; font: 14px system-ui; }
      main { padding: 20px; }
      h1 { margin-top: 0; font-size: 23px; }
      p { color: #bbb; }
      button { cursor: pointer; padding: 11px 13px; margin: 0 7px 9px 0; background: #9393ff; color: #181828; border: 0; border-radius: 6px; font-weight: 600; }
      button:disabled { opacity: .4; cursor: wait; }
      #fixture, #log { padding: 14px; border: 1px solid #555; background: #202020; white-space: pre-wrap; overflow-wrap: anywhere; }
      #log { max-height: 650px; overflow: auto; font: 12px ui-monospace, monospace; }
      iframe { width: 100%; height: 670px; border: 1px solid #555; background: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Diagnóstico local de SQLite</h1>
      <p>Fixture isolado: usa somente a chave kodetyStudioSqliteDiagnosticFixtureV1. O primeiro botão cria um projeto próprio; os demais operam somente nele. O teste de integridade usa uma cópia da base em /tmp dentro do PHP.</p>
      <div>
        <button id="create">Criar fixture</button>
        <button id="reopen">Reabrir normal</button>
        <button id="old-wordpress-metadata">Simular catálogo com WordPress antigo</button>
        <button id="two-phase">Reabrir em duas fases</button>
        <button id="database">Inspecionar banco e quick_check</button>
        <button id="health">Executar wp-load com diagnóstico</button>
        <button id="flush">Flush e fechar runtime</button>
        <button id="simulate-maintenance">Simular .maintenance no fixture</button>
        <button id="remove-maintenance">Remover .maintenance do fixture</button>
        <button id="hard-reload">Reload imediato sem flush</button>
        <button id="clear-log">Limpar log</button>
      </div>
      <pre id="fixture">Sem fixture</pre>
      <pre id="log" role="log" aria-live="polite"></pre>
      <iframe id="runtime" title="WordPress do fixture" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-downloads allow-modals"></iframe>
    </main>
    <script type="module" src="/.diagnostics/diagnostic.ts"></script>
  </body>
</html>
